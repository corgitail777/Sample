'use strict';const KEY='assembly-demo-v1';const seed=()=>({products:[{id:'a',name:'ハーネスA',sec:60,active:true},{id:'b',name:'ハーネスB',sec:75,active:true},{id:'c',name:'ハーネスC',sec:90,active:true}],workers:[{id:'w1',name:'田中',active:true},{id:'w2',name:'佐藤',active:true},{id:'w3',name:'鈴木',active:true},{id:'w4',name:'高橋',active:true},{id:'w5',name:'伊藤',active:true}],plans:[],assignments:[],actuals:[]});let persisted;try{persisted=JSON.parse(localStorage.getItem(KEY))}catch{}persisted=persisted&&Array.isArray(persisted.plans)?persisted:seed();let draft=structuredClone(persisted),tab='dashboard',date=new Date().toLocaleDateString('en-CA'),modalAction=null,drag=null,detailOrigin=null,detailChanged=false,detailPlanId=null,displayFrom=Number(localStorage.getItem('assembly-display-from')??0),displayTo=Number(localStorage.getItem('assembly-display-to')??1440);const $=id=>document.getElementById(id),id=()=>crypto.randomUUID(),clone=x=>structuredClone(x),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const mins=t=>{const [h,m]=String(t).split(':').map(Number);return h*60+m},clock=m=>`${String(Math.floor(((m%1440)+1440)%1440/60)).padStart(2,'0')}:${String(((m%60)+60)%60).padStart(2,'0')}`,startOfDay=420,rel=t=>{let m=mins(t)-startOfDay;return m<0?m+1440:m},timeAt=r=>clock(startOfDay+r),duration=(a,b)=>(rel(b)-rel(a)+1440)%1440;const dayPlans=()=>draft.plans.filter(p=>p.date===date),byId=(arr,x)=>arr.find(a=>a.id===x),product=p=>byId(draft.products,p.productId),worker=a=>byId(draft.workers,a.workerId),assigns=p=>draft.assignments.filter(a=>a.planId===p.id),actuals=p=>draft.actuals.filter(a=>a.planId===p.id).sort((a,b)=>a.at.localeCompare(b.at)),sumActual=p=>actuals(p).reduce((s,a)=>s+a.qty,0),fmtNum=n=>Math.round(n).toLocaleString('ja-JP');function theoretical(p,until=rel(p.end)){let n=0;for(const a of assigns(p)){const s=Math.max(rel(a.start),rel(p.start)),e=Math.min(rel(a.end),until);if(e>s)n+=(e-s)*60/(product(p)?.sec ringify(draft.products)!==JSON.stringify(persisted.products)||JSON.stringify(draft.workers)!==JSON.stringify(persisted.workers);function setStatus(t){$('status').textContent=t}function saveLocal(){localStorage.setItem(KEY,JSON.stringify(persisted))}function validate(){for(const a of draft.assignments){const p=byId(draft.plans,a.planId);if(!p)return '所属計画がない人員配置があります';if(rel(a.end)<=rel(a.start))return '人員配置の終了時刻は開始時刻より後にしてください';if(rel(a.start)<rel(p.start))return '人員配置の開始が生産計画より前です'}for(let i=0;i<draft.assignments.length;i++)for(let j=i+1;j<draft.assignments.length;j++){const a=draft.assignments[i],b=draft.assignments[j],pa=byId(draft.plans,a.planId),pb=byId(draft.plans,b.planId);if(a.workerId===b.workerId&&pa?.date===pb?.date&&rel(a.start)<rel(b.end)&&rel(b.start)<rel(a.end))return `${worker(a)?.name||'作業者'}の配置時間が重複しています`}for(const p of draft.plans){if(rel(p.end)<=rel(p.start))return '計画の終了時刻は開始時刻より後にしてください';if(p.qty<=0)return '目標数量は1以上にしてください'}return ''}function saveDraft(){const err=validate();if(err)return alert(err);persisted={...clone(draft),actuals:clone(persisted.actuals)};draft=clone(persisted);saveLocal();render();setStatus('計画・配置を保存しました（この端末のみ）')}function revert(){if(!hasChanges()||confirm('未保存の計画・配置変更を取り消しますか？')){draft=clone(persisted);render()}}function commitActuals(){persisted.actuals=clone(draft.actuals);saveLocal();setStatus('実績を保存しました（この端末のみ）')}function navigate(t){if(hasChanges()&&!confirm('未保存の計画・配置変更を破棄しますか？'))return;draft=clone(persisted);tab=t;render()}function setDate(d){if(hasChanges()&&!confirm('未保存の変更を破棄しますか？'))return;draft=clone(persisted);date=d;render()}let calendarMonth=date.slice(0,7);function toggleCalendar(force){const box=$('calendar');const open=typeof force==='boolean'?force:box.hidden;box.hidden=!open;$('date').setAttribute('aria-expanded',String(open));if(open){calendarMonth=date.slice(0,7);renderCalendar()}}function renderCalendar(){const box=$('calendar');if(box.hidden)return;const [year,month]=calendarMonth.split('-').map(Nu s,b.dataset.worker)));document.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>detail(byId(draft.plans,b.dataset.plan)));document.querySelectorAll('.track').forEach(t=>{t.addEventListener('pointerdown',onDown);t.addEventListener('pointerup',onUp);t.addEventListener('pointercancel',()=>drag=null)})}function onDown(ev){if(ev.button!==0)return;const t=ev.currentTarget,b=ev.target.closest('.bar'),rect=t.getBoundingClientRect(),x=Math.max(0,Math.min(1,(ev.clientX-rect.left)/rect.width)),r=Math.round(((displayFrom+x*(displayTo-displayFrom))/15))*15;drag={t,b,id:b?.dataset.id,kind:b?.dataset.kind,edge:ev.target.dataset.edge||'move',startX:ev.clientX,startY:ev.clientY,base:r,origin:b?clone(b.dataset.kind==='plan'?byId(draft.plans,b.dataset.id):byId(draft.assignments,b.dataset.id)):null,moved:false,row:t.dataset.row};t.setPointerCapture(ev.pointerId)}function onUp(ev){if(!drag)return;const d=drag;drag=null;const dx=ev.clientX-d.startX,dy=ev.clientY-d.startY,trackWidth=d.t.getBoundingClientRect().width,step=Math.round(dx/trackWidth*(displayTo-displayFrom)/15)*15;if(d.b){if(d.b.dataset.dashboardWorker==='1'){const a=byId(draft.assignments,d.id);detail(byId(draft.plans,a?.planId));return}const o=d.origin,target=d.kind==='plan'?byId(draft.plans,d.id):byId(draft.assignments,d.id);if(Math.abs(dx)<5&&Math.abs(dy)<8){if(d.kind==='plan')detail(target);else if(d.b.dataset.dashboardWorker==='1')detail(byId(draft.plans,target.planId));else assignmentEditor(target);return}let s=rel(o.start),e=rel(o.end);if(d.edge==='left')s=Math.max(0,Math.min(e-15,s+step));else if(d.edge==='right')e=Math.min(1440,Math.max(s+15,e+step));else{const delta=Math.max(-s,Math.min(1440-e,step));s+=delta;e+=delta}target.start=timeAt(s);target.end=timeAt(e);if(d.kind==='assignment')adjustPlanForStaff(byId(draft.plans,target.planId));if(d.kind==='assignment'&&d.edge==='move'){const tracks=[...document.querySelectorAll('.track[data-kind="worker"]')],row=tracks.find(t=>{const r=t.getBoundingClientRect();return ev.clientY>=r.top&&ev.clientY<=r.bottom});if(row)target.workerId=row.dataset.row}render();return}if(Math.abs(dx)<5){if(d.t.dataset.kind==='product')planEditor(null,d.base);else assignmentEditor(null,d.row,timeAt(d.base),timeAt(Math.min(1439,d.base+60)));return}if(d.t.dataset.kind==='worker'){const s=Math.max(0,Math.min(1425,d.base)),e=Math.max(s+15,Math.min(1440,d.base+step));assignmentEditor(null,d.row,timeAt(Math.min(s,e-15)),timeAt(Math.max(s+15,e)))}else planEditor(null,d.base)}// 削除操作はモーダルのイベント委譲で処理し、画面再生成後も有効にする。
$('modal').addEventListener('click',event=>{
  const button=event.target.closest('button');
  if(!button||!$('modalBody').contains(button))return;
  if(button.id==='deletePlan'){
    event.preventDefault();event.stopPropagation();
    const currentId=detailPlanId||$('modalBody').dataset.editingPlanId;
    if(!currentId){setStatus('削除対象の計画が見つかりません');return;}
    const old=$('deletePlanConfirm');if(old){old.remove();return;}
    const box=document.createElement('div');box.id='deletePlanConfirm';
    box.style.cssText='margin-top:12px;padding:12px;border:1px solid #f0b4b4;border-radius:8px;background:#fff5f5';
    box.innerHTML='<strong>この生産計画を削除しますか？</strong><p class="muted">関連する人員配置も削除されます。メイン画面の保存ボタンで確定します。</p><div style="display:flex;gap:8px"><button type="button" class="danger" id="deletePlanYes">削除する</button><button type="button" id="deletePlanNo">キャンセル</button></div>';
    button.insertAdjacentElement('afterend',box);
  }else if(button.id==='deletePlanNo'){
    event.preventDefault();$('deletePlanConfirm')?.remove();
  }else if(button.id==='deletePlanYes'){
    event.preventDefault();event.stopPropagation();
    const planId=detailPlanId||$('modalBody').dataset.editingPlanId;
    deleteProductionPlan(planId,true);
  }
});
$('prev').onclick=()=>dateShift(-1);$('next').onclick=()=>dateShift(1);$('date').onclick=()=>toggleCalendar();$('save').onclick=saveDraft;$('revert').onclick=revert;$('closeModal').onclick=()=>$('modal').close();$('confirmModal').onclick=()=>modalAction?.();window.addEventListener('beforeunload',e=>{if(hasChanges()){e.preventDefault();e.returnValue=''}});render();setStatus('ローカル保存版：Supabase未接続');
